name: "Backend Continuous Integration"

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint:check

      - name: Build application
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:ci

  Deploy:
    needs: CI

    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Deploy backend through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Enviando deploy do commit ${DEPLOY_SHA:0:12} para a EC2..."

          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy backend ${DEPLOY_SHA:0:12}" \
              --parameters "commands=[\"/usr/local/bin/controle-financeiro-deploy $DEPLOY_SHA\"]" \
              --query 'Command.CommandId' \
              --output text
          )

          echo "SSM Command ID: $COMMAND_ID"
          echo "Aguardando conclusão do deploy..."

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent}' \
              --output json
          else
            echo "Deploy falhou."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json \
              || true

            exit 1
          fi
