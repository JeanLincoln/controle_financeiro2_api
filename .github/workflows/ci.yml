name: "Backend Continuous Integration"

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint:check

      - name: Build application
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:ci

  SSMConnectivity:
    needs: CI

    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Inspect OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            );

            console.log(JSON.stringify({
              sub: payload.sub,
              aud: payload.aud,
              repository: payload.repository,
              repository_id: payload.repository_id,
              repository_owner: payload.repository_owner,
              repository_owner_id: payload.repository_owner_id,
              ref: payload.ref
            }, null, 2));

      - name: Test SSM connectivity
        shell: bash
        run: |
          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
              --document-name "AWS-RunShellScript" \
              --comment "GitHub Actions SSM connectivity test" \
              --parameters 'commands=["echo SSM_CONNECTION_OK","whoami"]' \
              --query 'Command.CommandId' \
              --output text
          )

          echo "Comando enviado ao SSM."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent}' \
            --output json
